name: CI

on:
  push:
    branches: [main, done, 'm*-*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  backend:
    name: Backend (build, unit, integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore (NuGet audit fails the build on vulnerable packages)
        run: |
          dotnet tool restore
          dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore -c Release -warnaserror

      - name: OpenAPI contract snapshot is up to date
        run: git diff --exit-code -- web/openapi/openapi.json

      - name: EF model matches the migrations
        run: dotnet ef migrations has-pending-model-changes --project src/Tailorly.App --no-build --configuration Release

      - name: Unit tests
        run: dotnet test --project tests/Tailorly.Tests --no-build -c Release --filter-namespace "Tailorly.Tests.Unit*"

      - name: Integration tests (Testcontainers PostgreSQL)
        run: dotnet test --project tests/Tailorly.Tests --no-build -c Release --filter-namespace "Tailorly.Tests.Integration*"

      - name: Eval datasets are valid (rules baseline, no model calls)
        run: dotnet run --project tests/Tailorly.Eval --no-build -c Release -- --no-write

      - name: Dependency vulnerability scan
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then exit 1; fi

  web:
    name: Web (lint, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Generated API client matches openapi.json
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts

      - name: Lint
        run: |
          npm run lint
          npx prettier --check "src/**/*.{ts,tsx,css}"

      - name: Build
        run: npm run build

      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high

  docker:
    name: Container images
    runs-on: ubuntu-latest
    needs: [backend, web]
    env:
      POSTGRES_PASSWORD: ci-only
    steps:
      - uses: actions/checkout@v7
      - name: Deploy scripts pass shellcheck
        run: shellcheck -x -S warning deploy/*.sh
      - name: Production Compose override is valid
        run: IMAGE_REPO=ghcr.io/example TAG=ci SITE_ADDRESS=tailorly.example docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml config --quiet
      - name: Build images
        run: docker compose -f deploy/docker-compose.yml build
      - name: Smoke test the stack
        run: |
          docker compose -f deploy/docker-compose.yml up -d --wait app caddy
          curl -fsSk https://localhost/healthz
          curl -fsSk https://localhost/readyz
          curl -fsSk https://localhost/api/v1/meta
          curl -fsSk https://localhost/ | grep -q '<div id="root">'
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color

  # ---- On main: publish images tagged with the git SHA, then deploy (SDD §13.3) ----
  publish:
    name: Publish images
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          repo="$(echo "$IMAGE_REPO" | tr '[:upper:]' '[:lower:]')"
          docker build -f deploy/Dockerfile -t "$repo/tailorly-app:${{ github.sha }}" .
          docker build -f deploy/web.Dockerfile -t "$repo/tailorly-web:${{ github.sha }}" .
          docker push "$repo/tailorly-app:${{ github.sha }}"
          docker push "$repo/tailorly-web:${{ github.sha }}"

  # Runs deploy/deploy.sh on the VM over SSH: pull → migrate → up -d → smoke test (/readyz + a scripted sign-in).
  # Configure the "production" environment (with required reviewers if wanted) with:
  #   vars:    DEPLOY_ENABLED=true, DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH (the repo checkout on the VM, e.g. /opt/tailorly)
  #   secrets: DEPLOY_SSH_KEY (a key allowed only for this user), DEPLOY_KNOWN_HOSTS (ssh-keyscan output of the VM)
  # The VM pulls from GHCR: log in once there with a read-only token (see deploy/runbooks/operator-runbook.md).
  deploy:
    name: Deploy to the VM
    runs-on: ubuntu-latest
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy ${{ github.sha }}
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SHA: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "set -e; cd '$DEPLOY_PATH' && git fetch --quiet origin && git checkout --quiet --detach '$SHA' && TAG='$SHA' deploy/deploy.sh"
