<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tailorly Remote — App prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== Tokens (final palette) ===== */
:root {
  --bg: #f7faf8; --surface: #ffffff; --surface-2: #eaf3ee; --border: #d5e3db;
  --text: #16150f; --muted: #6a675c;
  --accent: #0e7a53; --accent-hover: #0b6544; --accent-soft: rgba(14,122,83,.10); --on-accent: #ffffff;
  --amber: #9a5f00; --amber-soft: rgba(154,95,0,.12);
  --red: #b3362f; --red-soft: rgba(179,54,47,.10);
  --blue: #2563eb; --blue-soft: rgba(37,99,235,.10);
  --ink: #14130f; --ink-text: #eceae1; --ink-muted: #9a978b; --ink-line: #2a2922; --ink-active: #23221b;
  --diff-add: rgba(14,122,83,.14); --diff-del: rgba(179,54,47,.12);
  --shadow: 0 1px 2px rgba(22,21,15,.05), 0 10px 28px rgba(22,21,15,.07);
  --ring: rgba(14,122,83,.38);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f100d; --surface: #171813; --surface-2: #1e1f19; --border: #2b2c24;
    --text: #eeede6; --muted: #9b998c;
    --accent: #3ddc97; --accent-hover: #6ae8b1; --accent-soft: rgba(61,220,151,.12); --on-accent: #0b1a12;
    --amber: #f0b44c; --amber-soft: rgba(240,180,76,.13);
    --red: #f08a82; --red-soft: rgba(240,138,130,.12);
    --blue: #7aa7ff; --blue-soft: rgba(122,167,255,.14);
    --ink: #0a0b09; --ink-line: #1d1e19; --ink-active: #171813;
    --diff-add: rgba(61,220,151,.13); --diff-del: rgba(240,138,130,.14);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 36px rgba(0,0,0,.35);
    --ring: rgba(61,220,151,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f100d; --surface: #171813; --surface-2: #1e1f19; --border: #2b2c24;
  --text: #eeede6; --muted: #9b998c;
  --accent: #3ddc97; --accent-hover: #6ae8b1; --accent-soft: rgba(61,220,151,.12); --on-accent: #0b1a12;
  --amber: #f0b44c; --amber-soft: rgba(240,180,76,.13);
  --red: #f08a82; --red-soft: rgba(240,138,130,.12);
  --blue: #7aa7ff; --blue-soft: rgba(122,167,255,.14);
  --ink: #0a0b09; --ink-line: #1d1e19; --ink-active: #171813;
  --diff-add: rgba(61,220,151,.13); --diff-del: rgba(240,138,130,.14);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 36px rgba(0,0,0,.35);
  --ring: rgba(61,220,151,.45);
  color-scheme: dark;
}

/* ===== Base ===== */
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden; }
.mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 5px; }
h1, h2, h3, p { margin: 0; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ===== Shell ===== */
.app { height: 100%; display: grid; grid-template-columns: 224px minmax(0, 1fr); }
.app.no-shell { grid-template-columns: minmax(0, 1fr); }
.app.no-shell .side, .app.no-shell .mtop { display: none; }
.side { background: var(--ink); color: var(--ink-text); display: flex; flex-direction: column; padding: 18px 12px; gap: 14px; overflow: auto; }
.brand { display: flex; align-items: center; gap: 9px; padding: 0 8px; font-weight: 600; letter-spacing: -.01em; }
.brand .tag { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: #3ddc97; border: 1px solid #2c5a45; padding: 1px 6px; border-radius: 4px; font-weight: 500; }
.side nav { display: grid; gap: 2px; }
.navlabel { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); padding: 8px 10px 2px; opacity: .8; }
.side nav a { display: flex; justify-content: space-between; align-items: center; color: var(--ink-muted); padding: 7px 10px; border-radius: 7px; font-weight: 500; text-decoration: none; }
.side nav a:hover { color: var(--ink-text); background: var(--ink-active); }
.side nav a[aria-current="page"] { color: var(--ink-text); background: var(--ink-active); box-shadow: inset 2px 0 0 #3ddc97; }
.side nav .n { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-muted); }
.budget { margin-top: auto; border-top: 1px solid var(--ink-line); padding: 14px 8px 0; display: grid; gap: 10px; font-size: 12px; color: var(--ink-muted); }
.budget .r { display: flex; justify-content: space-between; margin-bottom: 4px; }
.budget .bar { height: 4px; border-radius: 9px; background: var(--ink-line); overflow: hidden; }
.budget .bar b { display: block; height: 100%; background: #3ddc97; }
.budget .bar b.warn { background: #f0b44c; }
.userrow { display: flex; align-items: center; gap: 9px; padding: 8px; }
.avatar { width: 28px; height: 28px; border-radius: 6px; background: #23221b; color: #3ddc97; display: grid; place-items: center; font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; flex: none; }
.userrow .who { flex: 1; min-width: 0; color: var(--ink-text); font-size: 13px; line-height: 1.25; }
.userrow .who small { display: block; color: var(--ink-muted); font-size: 11px; }
.icon-btn { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--ink-line); background: transparent; color: var(--ink-muted); border-radius: 7px; cursor: pointer; flex: none; }
.icon-btn:hover { color: var(--ink-text); }
.icon-btn.light { border-color: var(--border); color: var(--muted); }
.icon-btn.light:hover { color: var(--text); background: var(--surface-2); }
.mtop { display: none; align-items: center; gap: 10px; padding: 10px 14px; background: var(--ink); color: var(--ink-text); }
.main { min-height: 0; overflow: auto; display: flex; flex-direction: column; }
.main.flush { overflow: hidden; }
.page { width: 100%; max-width: 1180px; margin: 0 auto; padding: 26px 32px 72px; }
.page.narrow { max-width: 860px; }

/* ===== Type & layout helpers ===== */
.title { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
h1 { font-size: 22px; letter-spacing: -.02em; line-height: 1.25; }
.sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
h2 { font-size: 16px; letter-spacing: -.01em; }
h3.k { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: grid; gap: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
.card.flat { box-shadow: none; }
.card h2 + .sub { margin-bottom: 14px; }
.divider { height: 1px; background: var(--border); margin: 14px 0; }

/* ===== Buttons, chips ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); padding: 8px 13px; border-radius: 8px; cursor: pointer; font-weight: 500; text-decoration: none; color: var(--text); white-space: nowrap; }
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, var(--border)); background: transparent; }
.btn.danger:hover { background: var(--red-soft); }
.btn.danger.solid { background: var(--red); border-color: var(--red); color: #fff; }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn[disabled], .btn.disabled { opacity: .5; cursor: not-allowed; pointer-events: none; }
.btn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.chip { font-family: "IBM Plex Mono", monospace; font-size: 11px; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--border); color: var(--muted); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.chip.ok { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.chip.warn { color: var(--amber); background: var(--amber-soft); border-color: transparent; }
.chip.bad { color: var(--red); background: var(--red-soft); border-color: transparent; }
.chip.info { color: var(--blue); background: var(--blue-soft); border-color: transparent; }
.kbd { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); }

/* ===== Forms ===== */
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field > label, .lbl { font-size: 13px; font-weight: 500; }
.help { font-size: 12.5px; color: var(--muted); }
.err { font-size: 12.5px; color: var(--red); }
.input, .select, .textarea { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; outline: none; transition: border-color .15s, box-shadow .15s; }
.textarea { min-height: 120px; resize: vertical; line-height: 1.55; }
.input::placeholder, .textarea::placeholder { color: var(--muted); opacity: .7; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
.input[aria-invalid="true"], .textarea[aria-invalid="true"] { border-color: var(--red); }
.select { padding-right: 8px; }
.seg { display: inline-flex; background: var(--surface-2); padding: 3px; border-radius: 9px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 7px; color: var(--muted); font-weight: 500; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.field > .seg { justify-self: start; max-width: 100%; }
.sw { position: relative; display: inline-block; width: 38px; height: 22px; flex: none; }
.sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.sw span { position: absolute; inset: 0; background: var(--border); border-radius: 99px; transition: background .15s; }
.sw span::after { content: ""; position: absolute; width: 16px; height: 16px; top: 3px; left: 3px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.sw input:checked + span { background: var(--accent); }
.sw input:checked + span::after { transform: translateX(16px); }
.sw input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.setting { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--border); }
.setting:last-child { border-bottom: 0; }
.setting .t { font-weight: 500; } .setting .d { color: var(--muted); font-size: 12.5px; }
.chipsin { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; }
.chipsin:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
.chipsin input { border: 0; outline: 0; background: transparent; font: inherit; color: var(--text); flex: 1; min-width: 120px; padding: 3px 4px; }
.chipsin .tagx { display: inline-flex; align-items: center; gap: 5px; background: var(--surface-2); border-radius: 6px; padding: 2px 4px 2px 8px; font-size: 13px; }
.chipsin .tagx button { border: 0; background: transparent; cursor: pointer; color: var(--muted); padding: 0 3px; font-size: 14px; line-height: 1; }
input[type="range"] { accent-color: var(--accent); width: 100%; }
input[type="checkbox"].cb, input[type="radio"].cb { accent-color: var(--accent); width: 16px; height: 16px; }
.drop { display: block; border: 1.5px dashed color-mix(in srgb, var(--accent) 45%, var(--border)); border-radius: 12px; padding: 28px 18px; text-align: center; background: color-mix(in srgb, var(--accent-soft) 40%, transparent); cursor: pointer; }
.drop:hover { background: var(--accent-soft); }
.drop b { display: block; font-size: 15px; margin: 8px 0 2px; }

/* ===== Feedback ===== */
.alert { display: flex; gap: 10px; padding: 10px 12px; border-radius: 9px; font-size: 13px; border: 1px solid transparent; }
.alert.info { background: var(--blue-soft); color: var(--text); border-color: color-mix(in srgb, var(--blue) 25%, transparent); }
.alert.warn { background: var(--amber-soft); border-color: color-mix(in srgb, var(--amber) 28%, transparent); }
.alert.bad { background: var(--red-soft); border-color: color-mix(in srgb, var(--red) 28%, transparent); }
.alert.ok { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 28%, transparent); }
.alert svg { flex: none; margin-top: 2px; }
.meter { height: 6px; background: var(--surface-2); border-radius: 9px; overflow: hidden; }
.meter b { display: block; height: 100%; background: var(--accent); border-radius: 9px; }
.meter b.warn { background: var(--amber); } .meter b.bad { background: var(--red); }
.skel { background: linear-gradient(90deg, var(--surface-2), var(--bg), var(--surface-2)); background-size: 200% 100%; animation: sh 1.3s infinite; border-radius: 6px; height: 12px; }
@keyframes sh { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.empty { text-align: center; color: var(--muted); padding: 34px 14px; border: 1px dashed var(--border); border-radius: 12px; font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--text); color: var(--bg); padding: 9px 15px; border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: all .2s; z-index: 90; max-width: 90vw; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.overlay { position: fixed; inset: 0; background: rgba(10,11,9,.55); display: grid; place-items: center; z-index: 80; padding: 20px; }
.dialog { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; max-width: 440px; width: 100%; padding: 22px; box-shadow: var(--shadow); }
.dialog h2 { margin-bottom: 6px; }
.status { display: inline-flex; align-items: center; gap: 6px; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; }
.status i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.status.running i { background: var(--amber); animation: pulse 1s infinite; } .status.ready i { background: var(--accent); } .status.failed i { background: var(--red); }
@keyframes pulse { 50% { opacity: .35; } }

/* ===== Tables / tabs / stepper ===== */
.tablewrap { overflow: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 10px 14px; background: var(--surface-2); white-space: nowrap; }
td { padding: 10px 14px; border-top: 1px solid var(--border); vertical-align: middle; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; overflow: auto; }
.tabs button { border: 0; background: transparent; padding: 9px 13px; color: var(--muted); font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button:hover { color: var(--text); }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.stepper { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.step { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.step .n { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border); display: grid; place-items: center; font-family: "IBM Plex Mono", monospace; font-size: 11px; }
.step.done .n { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.step.now { color: var(--text); font-weight: 500; } .step.now .n { border-color: var(--accent); color: var(--accent); }
.step + .step::before { content: ""; width: 22px; height: 1px; background: var(--border); }

/* ===== Shortlist (master-detail) ===== */
.ms { height: 100%; display: grid; grid-template-columns: minmax(340px, 460px) minmax(0, 1fr); }
.listcol { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); background: var(--bg); }
.lhead { padding: 18px 18px 12px; border-bottom: 1px solid var(--border); display: grid; gap: 12px; }
.searchbox { position: relative; }
.searchbox .input { padding-right: 34px; background: var(--surface); }
.searchbox .kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill { border: 1px solid var(--border); background: transparent; color: var(--muted); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; }
.pill:hover { color: var(--text); }
.pill[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 500; }
.lscroll { overflow: auto; flex: 1; min-height: 0; }
.jrow { display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 10px; padding: 13px 18px; border: 0; border-bottom: 1px solid var(--border); cursor: pointer; position: relative; background: transparent; width: 100%; text-align: left; }
.jrow:hover { background: color-mix(in srgb, var(--surface) 70%, transparent); }
.jrow[aria-selected="true"] { background: var(--surface); box-shadow: inset 3px 0 0 var(--accent); }
.sc { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 17px; color: var(--muted); padding-top: 1px; }
.sc.hi { color: var(--accent); }
.rt { font-weight: 600; font-size: 14px; line-height: 1.3; } .rm { color: var(--muted); font-size: 12.5px; margin-top: 1px; }
.rchips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.saveddot { position: absolute; right: 16px; top: 14px; color: var(--accent); font-size: 12px; }
.lfoot { padding: 9px 18px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
.hiddenrow, .emptyrow { padding: 16px 18px; color: var(--muted); font-size: 12.5px; }
.detail { display: flex; flex-direction: column; min-height: 0; background: var(--surface); }
.dscroll { overflow: auto; flex: 1; padding: 22px 30px 40px; }
.dwrap { max-width: 760px; }
.back { display: none; margin-bottom: 12px; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; }
.crumb { color: var(--muted); font-size: 12.5px; margin-bottom: 8px; }
.dh { font-size: 24px; letter-spacing: -.02em; line-height: 1.2; }
.sec { border-top: 1px solid var(--border); padding: 16px 0; }
.fit { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.fit .big { font-family: "IBM Plex Mono", monospace; font-size: 34px; font-weight: 600; color: var(--accent); line-height: 1; }
ul.plain { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
ul.plain li { display: flex; gap: 8px; } ul.plain li::before { content: "›"; color: var(--accent); font-family: "IBM Plex Mono", monospace; }
.req { display: grid; grid-template-columns: 78px minmax(0,1fr); gap: 10px; align-items: center; padding: 4px 0; }
.quote { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; background: var(--surface-2); border-left: 3px solid var(--accent); padding: 9px 12px; border-radius: 0 6px 6px 0; margin-top: 8px; }
.kv .kk { color: var(--muted); font-size: 12px; margin-bottom: 2px; } .kv .vv { font-weight: 500; }

/* ===== Tailor workspace ===== */
.tw { display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); gap: 16px; align-items: start; }
.editlist { display: grid; gap: 8px; }
.edit { display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 10px; text-align: left; width: 100%; border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 11px 12px; cursor: pointer; }
.edit:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
.edit[aria-selected="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }

    '<div class="card"><h2>Form controls</h2><div class="grid2" style="margin-top:12px"><div class="field"><label for="sx1">Text field</label><input class="input" id="sx1" placeholder="Placeholder"></div><div class="field"><label for="sx2">Field with error</label><input class="input" id="sx2" aria-invalid="true" value="not-an-email"><span class="err">Enter a valid email address.</span></div><div class="field"><span class="lbl">Segmented</span><div class="seg"><button type="button" aria-pressed="true">Concise</button><button type="button" aria-pressed="false">Confident</button></div></div><div class="field"><span class="lbl">Switch and chips input</span><div class="row">' + sw('sx3', true) + '</div><div class="chipsin"><span class="tagx">Backend engineer<button type="button" aria-label="Remove">×</button></span><input aria-label="Add" placeholder="Type and press Enter"></div></div></div></div>' +
    '<div class="card"><h2>Feedback</h2><div class="stack" style="margin-top:12px"><div class="alert info">' + ico('info') + '<span>Information: your résumé is processed by an AI provider.</span></div><div class="alert ok">' + ico('check') + '<span>Success: résumé ready. ATS match re-scored to 81.</span></div><div class="alert warn">' + ico('warn') + '<span>Warning: Documents budget is 81% used.</span></div><div class="alert bad">' + ico('warn') + '<span>Error: <b>UNSUPPORTED_FILE_TYPE</b> Please upload the Word (.docx) version.</span></div>' +
